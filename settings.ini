; Market Brief settings
; Lines starting with ; are notes. After changing anything here,
; close the app window and start it again.

[app]
; How often to refresh, in minutes (30 = every half hour).
; The app also refreshes by itself shortly after each big US release.
refresh_minutes = 30

; Your time zone. Asia/Manila = Philippine time.
timezone = Asia/Manila

; Open the dashboard in your browser when the app starts (yes / no)
open_browser = yes

[symbols]
; Yahoo Finance symbols the app watches.
; GC=F is gold futures. It moves with spot XAUUSD but usually sits a
; few dollars higher, so use it for direction, not exact levels.
gold = GC=F
us30 = YM=F
dollar = DX-Y.NYB
treasury_10y = ZN=F
vix = ^VIX

[telegram]
; Optional phone alerts. See section 4 of the README to set this up.
; On GitHub, leave these empty! The repo is public, so the token goes in
; the repo's secret settings instead (README, part B).
enabled = no
bot_token =
chat_id =

; yes = message every refresh. no = only when a bias changes or a
; big release is coming up.
send_every_update = no
