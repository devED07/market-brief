name: Market Brief

# How updates keep coming every 15 or 30 minutes:
# Each update, when it finishes, lines up the next one. That next run waits
# in the "timer" environment, which has a 15- or 30-minute wait timer (set in
# Settings > Environments). Waiting there costs no Actions minutes.
# GitHub's own schedule below is a backup that restarts the chain if it
# ever stops. On the free plan GitHub often skips scheduled runs, which is
# why the chain exists.

on:
  schedule:
    # Times are UTC. :07 and :37 avoid GitHub's busy top of the hour.
    - cron: "7,37 * * * 1-5"
    - cron: "7 */3 * * 6"
    - cron: "7 0-18/3 * * 0"
    - cron: "7,37 21-23 * * 0"
  workflow_dispatch:
    inputs:
      chained:
        description: "Wait for the timer first (used by the update chain)"
        type: boolean
        default: false

permissions:
  contents: write   # publish the dashboard to the gh-pages branch
  actions: write    # line up the next update; keep the schedule switched on

jobs:
  wait:
    if: ${{ inputs.chained }}
    runs-on: ubuntu-latest
    environment: timer
    timeout-minutes: 5
    steps:
      - name: Check the timer really waited
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # If the timer isn't set, the wait is skipped. Stop here so updates
          # can never run back to back.
          created=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          waited=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 60 ))
          echo "Waited $waited minutes."
          if [ "$waited" -lt 10 ]; then
            echo "::error::The 'timer' environment has no wait timer (15 or 30 minutes). Stopping the chain."
            exit 1
          fi

  update:
    needs: wait
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    # One update at a time. A run that stays on around a big release makes
    # the next one wait instead of doubling up.
    concurrency:
      group: market-brief
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Update the dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional, free: real release numbers
          PYTHONUNBUFFERED: "1"
        run: python main.py --hosted

      - name: Line up the next update
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Safety: only chain if a wait timer of at least 10 minutes is set,
          # otherwise updates would run back to back.
          wait=$(gh api "repos/$REPO/environments/timer" \
                   --jq '[.protection_rules[]? | select(.type=="wait_timer") | .wait_timer][0] // 0' 2>/dev/null) || wait=0
          case "$wait" in ''|*[!0-9]*) wait=0 ;; esac
          echo "Wait timer: $wait minutes."
          if [ "$wait" -lt 10 ]; then
            echo "::warning::Set a wait timer of 15 or 30 minutes on the 'timer' environment (Settings > Environments) to get regular updates."
            exit 0
          fi
          # Keep a single chain: skip if another update is already lined up.
          lined_up=$(gh api "repos/$REPO/actions/workflows/market-brief.yml/runs?per_page=20" \
                   --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select(.status==\"waiting\" or .status==\"queued\" or .status==\"pending\" or .status==\"requested\")] | length") || lined_up=1
          case "$lined_up" in ''|*[!0-9]*) lined_up=1 ;; esac
          if [ "$lined_up" -gt 0 ]; then
            echo "Another update is already lined up."
            exit 0
          fi
          gh api -X POST "repos/$REPO/actions/workflows/market-brief.yml/dispatches" \
            -f ref=main -f "inputs[chained]=true" --silent
          echo "Next update lined up for about $wait minutes from now."

      # GitHub switches off schedules in public repos after 60 days without
      # activity. One call a day keeps the backup schedule going.
      - name: Keep the schedule switched on
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 40 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/market-brief.yml/enable" --silent
          fi
