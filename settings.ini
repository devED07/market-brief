; Market Brief settings
; Lines starting with ; are notes. After changing anything here,
; close the app window and start it again.

[app]
; How often to refresh, in minutes (30 = every half hour).
; The app also refreshes by itself shortly after each big US release.
refresh_minutes = 30

; Your time zone. Asia/Manila = Philippine time.
timezone = Asia/Manila

; Open the dashboard in your browser when the app starts (yes / no)
open_browser = yes

[symbols]
; Yahoo Finance symbols the app watches.
; GC=F is gold futures. It moves with spot XAUUSD but usually sits a
; few dollars higher, so use it for direction, not exact levels.
gold = GC=F
us30 = YM=F
; NQ=F is Nasdaq 100 futures (US100).
us100 = NQ=F
dollar = DX-Y.NYB
treasury_10y = ZN=F
vix = ^VIX

[fred]
; Optional free key for the real release numbers (README, part H).
; On GitHub, leave this empty and use the FRED_API_KEY secret instead.
api_key =

[telegram]
; Optional phone alerts. See part B of the README to set this up.
; On GitHub, leave bot_token and chat_id empty! The repo is public, so the
; token goes in the repo's secret settings instead (README, part B).
enabled = no
bot_token =
chat_id =

; yes = message every refresh. no = only when a bias changes or a
; big release is coming up.
send_every_update = no

; Weekday session brief, in your time zone (24-hour clock).
; 20:30 = 8:30 PM, before the London and New York overlap.
brief_time = 20:30
